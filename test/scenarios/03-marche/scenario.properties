# Deux vendeurs mettent chacun en vente une unite de marchandise depuis leur
# capitale, un acheteur enchérit sur les deux offres et les deux encheres
# sont reglees le meme tour (reglerEncheresMarche). Sous surveillance :
# ReceptionOrdres.encheresMarche (Map<OffreMarche, List<Enchere>>), dont la
# cle OffreMarche n'a ni equals() ni hashCode() (identite memoire), et dont
# reglerEncheresMarche() itere via entrySet() dans un ordre non garanti.
#
# Etalement sur 3 tours (ronde de correction, SHRL-46, task-8) :
#   - tour 1 : aucun ordre. Possession.evolutionPosteCo (production de
#     marchandise) est appelee depuis DeroulementDuTour.gestionFinDeTour,
#     donc APRES le traitement des ordres du meme tour (ReceptionOrdres.
#     deroulementOrdres). Au tour 0 (juste apres l'inscription), toutes les
#     possessions sont a zero marchandise ; vendre au tour 1 echouerait donc
#     en ER_COMMANDANT_VENTE_GALACTIQUE_0002.
#   - tour 2 : vendre_galactique une fois la production du tour 1 creditee.
#   - tour 3 : acheter_galactique sur les deux offres (turn distinct du tour
#     de vente, cf. piege documente en tete de test/harness/lib.sh : une
#     offre postee au tour 2 n'est visible par un OFFRE(...) resolu depuis le
#     dump du tour 2 qu'au tour 3). Le reglement (reglerEncheresMarche) a
#     lieu le meme tour que l'ordre d'achat (ReceptionOrdres.
#     deroulementOrdres, index ORDRE_ACHAT_GALACTIQUE), donc le resultat est
#     deja visible dans dump-tour-3.txt : pas de tour d'observation
#     supplementaire necessaire.
#
# RESERVE DE FAISABILITE (constatee avant d'ecrire ce qui precede) : le
# format de dump ".marchandise.<code> = <PRIX>/<QUANTITE>" (DumpEtat.java:
# 111-113) place le PRIX en premier, l'inverse d'une lecture naive. Apres un
# seul tour de production sans ordre, une possession de depart ne detient
# que 1 a 3 unites de chaque marchandise (marchandise.7 = 49/1 signifie
# quantite 1, pas 49) : vendre 40 ou 50 unites a ce stade echoue
# silencieusement (aucune offre creee, erreur ER_COMMANDANT_VENTE_
# GALACTIQUE_0002 dans le rapport XML, jamais dans le dump). La marchandise
# 7 est la seule presente avec au moins 1 unite aux DEUX capitales sous
# cette graine ; les deux offres portent donc sur 1 unite chacune.
#
# NON-DETERMINISME NON REPRODUIT PAR CE SCENARIO (constate, pas postule) :
# la conception initiale visait un acheteur enchérissant sur deux offres
# sans avoir les moyens des deux, pour que l'ordre de reglement decide
# laquelle aboutit. Verification du code (ReceptionOrdres.java:272-324) :
# acheter_galactique ne verifie le budget qu'A LA SOUMISSION de l'ordre,
# contre les centaures NON ENCORE debitees (aucune des deux encheres n'a
# encore ete reglee a ce moment), et reglerEncheresMarche() ne revérifie
# jamais le budget au reglement (Commandant.acheterGalactique debite sans
# condition). Le flag "dejaAchete" est de plus scope PAR OFFRE (declare a
# l'interieur de la boucle sur encheresMarche.entrySet(), ligne ~309), donc
# deux offres distinctes n'entrent jamais en concurrence entre elles. Avec
# deux offres distinctes et un seul enchérisseur par offre, les deux
# encheres se reglent TOUJOURS toutes les deux, quel que soit l'ordre de
# parcours de la Map : l'etat final (centaures, marchandises, offres
# restantes) est une somme commutative, invariante par permutation.
# check-determinisme.sh 03-marche est passe OK sur 5 executions consecutives
# AVANT la correction du tri (aucun rouge constate) ; le detail figure au
# rapport de tache. Le bug d'absence d'equals()/hashCode() sur OffreMarche
# reste reel et corrige (Map hachee par identite memoire, ordre d'iteration
# non garanti), mais ce scenario ne peut pas l'exhiber via une comparaison
# de dump : aucune configuration d'offres/encheres trouvee, avec le code
# actuel, ne fait dependre l'etat final de l'ordre de reglement (aucun etat
# partage ni verification budgetaire au reglement). La correction reste
# appliquee car le diagnostic structurel est confirme independamment
# (scan de coherence) et la protege contre une regression future si le
# reglement venait a introduire un etat partage entre offres.
RANDOM_SEED = 20260820
DATE_FIGEE = 01/01/2000
TOURS = 3
