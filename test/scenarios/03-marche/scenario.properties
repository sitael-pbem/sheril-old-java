# Deux vendeurs mettent chacun en vente une unite de marchandise depuis leur
# capitale, un acheteur enchérit sur les deux offres et les deux encheres
# sont reglees le meme tour (reglerEncheresMarche). Sous surveillance :
# ReceptionOrdres.encheresMarche (Map<OffreMarche, List<Enchere>>), dont la
# cle OffreMarche n'a ni equals() ni hashCode() (identite memoire), et dont
# reglerEncheresMarche() itere via entrySet() dans un ordre non garanti.
#
# Etalement sur 3 tours (ronde de correction, SHRL-46, task-8) :
#   - tour 1 : aucun ordre. Possession.evolutionPosteCo (production de
#     marchandise) est appelee depuis DeroulementDuTour.gestionFinDeTour,
#     donc APRES le traitement des ordres du meme tour (ReceptionOrdres.
#     deroulementOrdres). Au tour 0 (juste apres l'inscription), toutes les
#     possessions sont a zero marchandise ; vendre au tour 1 echouerait donc
#     en ER_COMMANDANT_VENTE_GALACTIQUE_0002.
#   - tour 2 : vendre_galactique une fois la production du tour 1 creditee.
#   - tour 3 : acheter_galactique sur les deux offres (turn distinct du tour
#     de vente, cf. piege documente en tete de test/harness/lib.sh : une
#     offre postee au tour 2 n'est visible par un OFFRE(...) resolu depuis le
#     dump du tour 2 qu'au tour 3). Le reglement (reglerEncheresMarche) a
#     lieu le meme tour que l'ordre d'achat (ReceptionOrdres.
#     deroulementOrdres, index ORDRE_ACHAT_GALACTIQUE), donc le resultat est
#     deja visible dans dump-tour-3.txt : pas de tour d'observation
#     supplementaire necessaire.
#
# RESERVE DE FAISABILITE (constatee avant d'ecrire ce qui precede) : le
# format de dump ".marchandise.<code> = <PRIX>/<QUANTITE>" (DumpEtat.java:
# 111-113) place le PRIX en premier, l'inverse d'une lecture naive. Apres un
# seul tour de production sans ordre, une possession de depart ne detient
# que 1 a 3 unites de chaque marchandise (marchandise.7 = 49/1 signifie
# quantite 1, pas 49) : vendre 40 ou 50 unites a ce stade echoue
# silencieusement (aucune offre creee, erreur ER_COMMANDANT_VENTE_
# GALACTIQUE_0002 dans le rapport XML, jamais dans le dump). La marchandise
# 7 est la seule presente avec au moins 1 unite aux DEUX capitales sous
# cette graine ; les deux offres portent donc sur 1 unite chacune.
#
# NON-DETERMINISME : PORTE PAR LES RAPPORTS, PAS PAR L'ETAT DU JEU (correction
# apres ronde de revue 1, SHRL-46, task-8). La conception initiale visait un
# acheteur enchérissant sur deux offres sans avoir les moyens des deux, pour
# que l'ordre de reglement decide laquelle aboutit. C'est faux :
# acheter_galactique ne verifie le budget qu'A LA SOUMISSION de l'ordre,
# contre les centaures NON ENCORE debitees, et reglerEncheresMarche() ne
# revérifie jamais le budget au reglement (Commandant.acheterGalactique
# debite sans condition, ReceptionOrdres.java:272-324). Le flag "dejaAchete"
# est de plus scope PAR OFFRE, donc deux offres distinctes n'entrent jamais
# en concurrence entre elles : avec un seul enchérisseur par offre, les deux
# encheres se reglent TOUJOURS toutes les deux, quel que soit l'ordre de
# parcours de la Map, et l'etat du jeu (centaures, marchandises, offres
# restantes) est une somme commutative, invariante par permutation. C'est
# pour ca que check-determinisme.sh 03-marche passait OK sur 8 executions
# consecutives avant la correction du tri : PAS parce que le defaut est
# absent, mais parce que l'oracle ne regardait pas la ou il se voit.
#
# L'EFFET REEL EXISTE, et ce scenario le declenche deja : acheterGalactique
# ajoute un evenement EV_COMMANDANT_ACHAT_GALACTIQUE_0000 a l'acheteur a
# chaque reglement (Commandant.java:4146), range par Commentaire dans une
# ArrayList en ordre d'insertion (Commentaire.java:17-42). L'acheteur de ce
# scenario en recoit deux, et leur ordre EST l'ordre de parcours de
# encheresMarche : verifie dans test/work/03-marche/data/tour4/rapports/
# 3tour4/rapport.xml, qui contient "Vous avez acheté au commandant" Vendeur1
# puis Vendeur2. check-determinisme.sh compare desormais aussi les rapports
# XML entre les deux repetitions (pas seulement les dumps, cf. tete de
# test/harness/lib.sh) : c'est la que cherche voir ce defaut, pas dans
# dump-tour-N.txt (DumpEtat n'ecrit ni message ni evenement, et
# DumpEtat.ecrireMarche re-trie deja les offres par identifiant avant
# ecriture, DumpEtat.java:250-255, donc meme la section marche du dump y est
# insensible).
#
# Second couplage identifie en revue, non exploite par ce scenario : une
# offre portant un code de bâtiment ferait lever une ClassCastException au
# reglement (OffreMarche.getObjetTransporte() construit un
# ObjetSimpleTransporte, OffreMarche.java:83, la ou Systeme.ajouterRichesses
# caste en ObjetComplexeTransporte pour ce type de chargement,
# Systeme.java:1093 ; les deux classes sont freres, pas parentes). Les
# offres reglees avant le lancer restent reglees, les suivantes jamais :
# c'est un second exemple concret d'ordre de reglement qui compte, distinct
# de l'ordre des messages ci-dessus.
#
# La correction du tri par identifiant croissant reste appliquee : elle
# rend deterministe a la fois l'ordre des messages d'achat dans le rapport
# de l'acheteur et, si un scenario venait a exercer le second couplage, quel
# sous-ensemble d'offres serait effectivement reglees avant un eventuel
# plantage.
RANDOM_SEED = 20260820
DATE_FIGEE = 01/01/2000
TOURS = 3
