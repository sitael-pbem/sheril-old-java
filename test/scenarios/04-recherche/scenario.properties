# Un commandant affecte tout son budget à progcoI (niveau 0, sans parent) et
# la cherche jusqu'à ce qu'elle aboutisse. Sous surveillance :
# Commandant.resolutionProgressionRecherche, Technologie.listeDesTechnologiesAtteignables.
#
# ATTENTION AU NOM : le brief initial visait Univers.gestionTechno et
# Technologie.testDevenirTechnologiesPubliques (passage d'une technologie au
# domaine public). Les deux se sont révélées inobservables avec progcoI, par
# lecture de code puis confirmation empirique (voir turn-1.sql et le rapport
# de tâche) :
#   - Univers.gestionTechno() est un corps de méthode vide (Univers.java:1690-1692),
#     un appel sans aucun effet, quel que soit le scénario.
#   - Technologie.testDevenirTechnologiesPubliques() (Technologie.java:269-307)
#     compte, pour chaque technologie non publique, le nombre de commandants
#     humains qui la connaissent, mais seulement si
#     "Arrays.binarySearch(TECHNOLOGIES_RESERVED, corpsCode) == -1"
#     (Technologie.java:289-290). Arrays.binarySearch ne rend -1 QUE quand
#     l'élément cherché s'insérerait en tête du tableau trié ; pour tout code
#     qui s'insérerait ailleurs, il rend une autre valeur négative (ex. -7),
#     jamais -1, et la condition reste fausse pour toujours. Comme
#     TECHNOLOGIES_RESERVED = {"maitr0_", ..., "maitr5_"} (Const.java:873),
#     seuls les corps de code lexicographiquement AVANT "maitr0_" peuvent un
#     jour être comptés (ex. "diplo", "gestpla", "info" : d/g/i < m) ; tout
#     corps de code à "maitr0_" ou après (ex. "progco", "stratco", "miss" :
#     p/s/m... > m) n'est JAMAIS compté, donc ne passe jamais au domaine
#     public, quel que soit le nombre de tours ou de commandants. progcoI
#     étant la seule candidate à 50 points restant disponible pour ce
#     scénario (stratcoI est déjà exercée par 01-combat, gestplaI par
#     02-colonisation, diploI est réservée à 05-alliances), le passage au
#     domaine public n'est structurellement pas observable ici.
#   - Confirmé par exécution : avec ce même commandant seul (setup.sql),
#     gestplaI (corps "gestpla" < "maitr0_") disparaît de
#     commandant.1.technologies dès le tour 1 (elle devient publique), tandis
#     qu'à graine et affectation identiques progcoI (corps "progco" >
#     "maitr0_") y reste indéfiniment. Le même mécanisme fait disparaître
#     infoII (technologie initiale de la race 3, "info" < "maitr0_") du
#     dump dès le tour 1, indépendamment de tout ordre de ce scénario : c'est
#     un effet de bord visible mais non lié à l'action testée ici, donc non
#     retenu comme assertion.
#
# Ce que le scénario retient donc réellement : l'effet observable et robuste
# de la recherche est l'apparition de progcoI dans commandant.1.technologies,
# clé absente de tout dump avant l'acquisition. C'est l'assertion la plus
# solide selon la règle du harnais (une clé absente sans l'action ne peut pas
# être vraie), et se suffit à distinguer un run qui exerce vraiment la
# recherche d'un run vide.
#
# progcoI (ListeTechnologique.java:473) est cherchable au tour 1 par tout
# commandant, quelle que soit la race (parents = null). Coût affiché 50
# points, coût effectif 200 points (Const.MODIFICATEUR_DIFFICULTE_RECHERCHE
# = 4, Const.java:189), acquis en un seul tour à 100% du budget technologique
# (même schéma que stratcoI dans 01-combat et gestplaI dans 02-colonisation).
# TOURS = 2 : le tour d'acquisition (tour 1), plus un tour témoin de
# persistance (confirme que progcoI reste connu, jamais publique).
RANDOM_SEED = 20260821
DATE_FIGEE = 01/01/2000
TOURS = 2
