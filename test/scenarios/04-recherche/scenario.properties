# Un commandant affecte tout son budget à progcoI (niveau 0, sans parent) et
# la cherche jusqu'à ce qu'elle aboutisse. Sous surveillance :
# Commandant.resolutionProgressionRecherche, Technologie.listeDesTechnologiesAtteignables,
# et par effet de bord exercé (voir plus bas) Technologie.testDevenirTechnologiesPubliques.
#
# ATTENTION AU NOM : le brief initial visait le passage de progcoI elle-même
# au domaine public (Technologie.testDevenirTechnologiesPubliques), en
# observant "le moment où la technologie passe de .recherche.<techno> à
# .technologies". C'est faux sur les deux points, établi par lecture de code
# puis confirmation empirique :
#   - Le sens de l'événement est inversé : le dump n'expose que les
#     technologies NON publiques (DumpEtat.java:88,
#     listeTechnologiesNonPubliquesConnues()). Une technologie qui devient
#     publique DISPARAÎT du dump, elle n'y apparaît pas.
#   - progcoI elle-même ne peut jamais devenir publique, à cause d'un bug de
#     comparaison dans testDevenirTechnologiesPubliques() (Technologie.java:
#     269-307). La condition qui décide si une technologie compte pour le
#     seuil de publicisation est
#     "Arrays.binarySearch(TECHNOLOGIES_RESERVED, corpsCode) == -1"
#     (Technologie.java:289-290). TECHNOLOGIES_RESERVED = {"maitr0_", ...,
#     "maitr5_"} (Const.java:873) EST bien trié : ce n'est donc pas le défaut
#     classique d'un binarySearch sur tableau non trié, et le résultat n'est
#     pas indéfini. Le seul défaut est le test "== -1" là où l'absence
#     s'éprouve par "< 0" : Arrays.binarySearch sur un élément absent rend
#     "-(pointInsertion)-1", qui ne vaut -1 QUE si l'élément s'insère en tête
#     du tableau trié. Comme aucune technologie de corps de code "maitr0_" à
#     "maitr5_" n'existe dans ListeTechnologique.java (seuls
#     ListeParents.java:494 et ListeDescription.java:97 portent ce nom, et
#     LISTE_TECHNOLOGIES est chargée par réflexion depuis la seule
#     ListeTechnologique, Univers.java:1119), ce filtre ne protège
#     concrètement AUCUNE technologie : il n'a que son effet parasite. Seuls
#     les corps de code lexicographiquement AVANT "maitr0_" passent un jour
#     le test (ex. "diplo", "gestpla", "info" : d/g/i < m) ; tout corps de
#     code à "maitr0_" ou après (ex. "progco", "stratco", "miss" : p/s/m...
#     > m) échoue le test "== -1" pour toujours, donc n'est jamais compté et
#     ne passe jamais au domaine public. progcoI ("progco" > "maitr0_") en
#     fait partie.
#
# CE QUE LE SCÉNARIO OBSERVE RÉELLEMENT, ET REVENDIQUE : progcoI ne peut
# jamais devenir publique, mais la transition elle-même EST observée dans ce
# scénario, sur infoII (technologie initiale de la race 3 du commandant,
# Const.RACE_TECHNOLOGIES, Const.java:595, corps "info" < "maitr0_", donc
# non filtrée). Avec un seul commandant humain, le seuil de publicisation
# "nb > (c.length * 60) / 100" (Technologie.java:292) vaut
# "1 > (1*60)/100 = 1 > 0", vrai dès que ce commandant connaît une
# technologie non filtrée : infoII, connue depuis la création du
# commandant, bascule donc au domaine public dès le tour 1, indépendamment
# de tout ordre de ce scénario.
#
# assertions-tour-1.txt et assertions.txt portent la même ligne
# "commandant.1.technologies = missI,progcoI" : verifier_assertions compare
# la LIGNE ENTIÈRE par grep -qxF (run-scenario.sh:68), donc cette assertion
# échouerait si infoII restait dans la liste (elle porterait
# "infoII,missI,progcoI"). Elle verrouille donc DEUX effets à la fois :
# l'acquisition de progcoI (clé absente sans l'action) ET la disparition
# d'infoII, sa publicisation (vue rouge vérifiée sur une variante à deux
# commandants humains, voir assertions-tour-1.txt).
#
# progcoI (ListeTechnologique.java:473) est cherchable au tour 1 par tout
# commandant, quelle que soit la race (parents = null). Coût affiché 50
# points, coût effectif 200 points (Const.MODIFICATEUR_DIFFICULTE_RECHERCHE
# = 4, Const.java:189), acquis en un seul tour à 100% du budget technologique
# (même schéma que stratcoI dans 01-combat et gestplaI dans 02-colonisation).
# TOURS = 2 : le tour d'acquisition (tour 1), plus un tour témoin de
# persistance du golden (ne discrimine pas progcoI elle-même, gardé pour la
# valeur du golden).
RANDOM_SEED = 20260821
DATE_FIGEE = 01/01/2000
TOURS = 2
