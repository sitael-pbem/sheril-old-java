# pouvoir enfin construire le Colonisateur (turn-5.sql) et l'employer
# (turn-6.sql). La taxation (turn-7.sql, turn-8.sql) exige elle aussi une
# technologie non connue au départ, gestplaI, recherchée en marge
# (turn-3.sql). Aucune de ces deux technologies n'est utilisable le tour où
