# Un commandant construit un colonisateur puis l'emploie sur une planète de
# son propre système capital, avant de faire varier la taxation. Sous
# surveillance : Possession, Population, Planete, la taxation.
#
# Étalé sur 8 tours (ronde de correction du plan initial, SHRL-46, task-7) :
# le plan prévoyait 3 tours en obtenant le colonisateur par un INSERT direct
# dans aa_vaisseaux (VAISSEAU = 9), impossible (Flotte.choixFlotteDeDepart
# ne connaît que 5 quotas nommés, indices 1 à 5, Flotte.java:257-289). La
# voie réelle passe par l'ordre construire (plan public "Colonisateur",
# Univers.java:1167-1168), qui exige à son tour une unité de la marchandise
